name: Harden Alert v0.2 finite values

on:
  push:
    branches:
      - agent/alert-registration-v0-2

permissions:
  contents: write

jobs:
  harden-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[v02-finite]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alert-registration-v0-2

      - name: Reject non-finite trade-plan values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path("notifier/alert_ledger_registration.py")
          text = module.read_text(encoding="utf-8")
          text = text.replace("import logging\nimport os", "import logging\nimport math\nimport os", 1)
          old_numeric = '''    if isinstance(value, (int, float)):\n        try:\n            return float(value)\n        except (TypeError, ValueError, OverflowError):\n            return None\n'''
          new_numeric = '''    if isinstance(value, (int, float)):\n        try:\n            number = float(value)\n            return number if math.isfinite(number) else None\n        except (TypeError, ValueError, OverflowError):\n            return None\n'''
          old_parsed = '''    try:\n        return float(match.group(0).replace(",", ""))\n    except (TypeError, ValueError, OverflowError):\n        return None\n'''
          new_parsed = '''    try:\n        number = float(match.group(0).replace(",", ""))\n        return number if math.isfinite(number) else None\n    except (TypeError, ValueError, OverflowError):\n        return None\n'''
          if text.count(old_numeric) != 1 or text.count(old_parsed) != 1:
              raise SystemExit("registration numeric blocks did not match exactly")
          text = text.replace(old_numeric, new_numeric, 1).replace(old_parsed, new_parsed, 1)
          module.write_text(text, encoding="utf-8")

          test_path = Path("scripts/alert_ledger_registration_v02_test.py")
          test_text = test_path.read_text(encoding="utf-8")
          needle = '''    @unittest.skipIf(trade_alert_module is None, "complete repository required")\n    def test_08_trade_alert_passes_exact_raw_plan(self):\n'''
          replacement = '''    def test_08_non_finite_prices_fail_closed(self):\n        self.initialize()\n        env = {**self.env, FEATURE_FLAG: "1"}\n        for field, value in (("entry", float("nan")), ("stop", float("inf")), ("target_2", float("-inf"))):\n            invalid = {**EXACT_PLAN, field: value}\n            self.assertIsNone(\n                prepare_trade_alert_registration(LOW_TEXT, plan=invalid, env=env),\n                f"{field}={value!r} should be rejected",\n            )\n\n    @unittest.skipIf(trade_alert_module is None, "complete repository required")\n    def test_09_trade_alert_passes_exact_raw_plan(self):\n'''
          if test_text.count(needle) != 1:
              raise SystemExit("v0.2 integration test insertion point did not match")
          test_path.write_text(test_text.replace(needle, replacement, 1), encoding="utf-8")
          PY

      - name: Run all focused tests
        shell: bash
        run: |
          python -m py_compile \
            notifier/alert_ledger_registration.py \
            notifier/telegram_notifier.py \
            notifier/trade_alert.py \
            scripts/scenario_ledger.py \
            scripts/scenario_ledger_core_test.py \
            scripts/alert_ledger_registration_test.py \
            scripts/alert_ledger_registration_v02_test.py
          python -W error::ResourceWarning scripts/scenario_ledger_core_test.py
          python -W error::ResourceWarning scripts/alert_ledger_registration_test.py
          python -W error::ResourceWarning scripts/alert_ledger_registration_v02_test.py

      - name: Commit verified hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifier/alert_ledger_registration.py scripts/alert_ledger_registration_v02_test.py
          git commit -m "Reject non-finite ledger plan values [v02-finite]"
          git push origin HEAD:agent/alert-registration-v0-2
