name: Strategy Arena Funding Carry Research

on:
  pull_request:
    branches:
      - server-current-8000-2026-06-18
    paths:
      - 'strategy_arena/funding_carry_research.py'
      - '.github/workflows/strategy-arena-funding-carry-research.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Funding Carry economic relationship study
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m strategy_arena.funding_carry_research \
            --symbol BTCUSDT \
            --start-month 2019-09 \
            --end-month 2026-06 \
            --store-root data/arena/funding_carry_market_store \
            --output-dir data/arena/funding_carry_research \
            --workers 6 2>&1 | tee data/arena/funding_carry_research.log
      - name: Show summary
        if: always()
        run: cat data/arena/funding_carry_research/funding_carry_research_summary.json || true
      - name: Upload research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-arena-funding-carry-research
          path: |
            data/arena/funding_carry_research
            data/arena/funding_carry_research.log
          retention-days: 90
          if-no-files-found: warn
