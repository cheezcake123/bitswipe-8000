name: Full History Secret Scan

on:
  push:
    branches:
      - agent/full-history-secret-scan
    paths:
      - .github/workflows/full-history-secret-scan.yml
  pull_request:
    branches:
      - server-current-8000-2026-06-18
    paths:
      - .github/workflows/full-history-secret-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch all accessible branches, tags, and pull request refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*'
          echo "Reachable commits: $(git rev-list --all --count)"
          echo "Reachable refs: $(git for-each-ref --format='%(refname)' | wc -l)"

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan every reachable commit without exposing secret values
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/gitleaks-report.json"
          SCAN_LOG="$RUNNER_TEMP/gitleaks-scan.log"

          # --redact=100 prevents detected secret values from being printed.
          # The full report and raw scanner output remain runner-temporary only:
          # they are never uploaded as artifacts and are deleted before this step exits.
          if ! gitleaks git \
            --no-banner \
            --redact=100 \
            --report-format json \
            --report-path "$REPORT" \
            --exit-code 0 \
            --log-opts="--all --full-history" \
            . >"$SCAN_LOG" 2>&1; then
            rm -f "$REPORT" "$SCAN_LOG"
            echo "Gitleaks execution failed before a trustworthy result was produced." >&2
            exit 2
          fi

          FINDINGS_COUNT="$(python - "$REPORT" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.exists() or path.stat().st_size == 0:
              print(0)
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              print(len(data) if isinstance(data, list) else 0)
          PY
          )"

          echo "findings_count=$FINDINGS_COUNT" >> "$GITHUB_OUTPUT"
          echo "Gitleaks findings count: $FINDINGS_COUNT"
          {
            echo "### Full-history secret scan"
            echo "- Scanner: Gitleaks v8.30.1"
            echo "- Git scope: all reachable refs via \`git log --all --full-history\`"
            echo "- Findings count: $FINDINGS_COUNT"
            echo "- Secret values: fully redacted; no report artifact uploaded"
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f "$REPORT" "$SCAN_LOG"

      - name: Fail closed when findings exist
        if: steps.scan.outputs.findings_count != '0'
        shell: bash
        run: |
          echo "Secret scan completed with ${FINDINGS_COUNT} finding(s). Values were not printed or uploaded."
          exit 1
        env:
          FINDINGS_COUNT: ${{ steps.scan.outputs.findings_count }}
