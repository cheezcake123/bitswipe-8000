name: Apply Alert Registration v0.2 patch

on:
  push:
    branches:
      - agent/alert-registration-v0-2

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[v02-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alert-registration-v0-2

      - name: Patch exact trade plan handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("notifier/trade_alert.py")
          raw = path.read_bytes()
          old = b"        telegram_result = send_telegram_message(message)"
          if raw.count(old) != 1:
              raise SystemExit(f"expected one Telegram call, found {raw.count(old)}")

          newline = b"\r\n" if b"\r\n" in raw else b"\n"
          lines = [
              b"        registration_plan = {",
              b'            "symbol": symbol,',
              b'            "direction": side,',
              b'            "entry": entry_num,',
              b'            "stop": stop_num,',
              b'            "target_1": target_1_num,',
              b'            "target_2": target_2_num,',
              b'            "rr": _safe_float(guard.get("risk_reward_ratio")),',
              b'            "confidence": confidence,',
              b'            "signature": signature,',
              b'            "risk_verdict": verdict,',
              b"        }",
              b"",
              b"        telegram_result = send_telegram_message(",
              b"            message,",
              b"            registration_plan=registration_plan,",
              b"        )",
          ]
          replacement = newline.join(lines)
          path.write_bytes(raw.replace(old, replacement, 1))
          PY

      - name: Compile and run focused tests
        shell: bash
        run: |
          python -m py_compile \
            notifier/alert_ledger_registration.py \
            notifier/telegram_notifier.py \
            notifier/trade_alert.py \
            scripts/scenario_ledger.py \
            scripts/scenario_ledger_core_test.py \
            scripts/alert_ledger_registration_test.py \
            scripts/alert_ledger_registration_v02_test.py
          python -W error::ResourceWarning scripts/scenario_ledger_core_test.py
          python -W error::ResourceWarning scripts/alert_ledger_registration_test.py
          python -W error::ResourceWarning scripts/alert_ledger_registration_v02_test.py

      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet -- notifier/trade_alert.py; then
            echo "trade_alert.py already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifier/trade_alert.py
          git commit -m "Route exact trade plan to ledger [v02-patched]"
          git push origin HEAD:agent/alert-registration-v0-2
