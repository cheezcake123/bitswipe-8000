name: Strategy Arena Forward OOS Selector Foundation

# Revalidated after PR #29 was retargeted to the default branch.
on:
  pull_request:
    branches:
      - feature/funding-extreme-reversal-long-validation
      - server-current-8000-2026-06-18
    paths:
      - 'strategy_arena/forward_oos_selector_foundation.py'
      - 'strategy_arena/forward_oos_runtime.py'
      - 'strategy_arena/forward_oos_live_runner.py'
      - 'strategy_arena/forward_oos_league_runner.py'
      - 'strategy_arena/forward_oos_league_daemon.py'
      - 'strategy_arena/frozen_strategy_registry.json'
      - 'strategy_arena/promotion_gates.json'
      - 'strategy_arena/FORWARD_OOS_SELECTOR_FOUNDATION.md'
      - 'tests/test_forward_oos_selector_foundation.py'
      - '.github/workflows/strategy-arena-forward-oos-selector.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run frozen registry and selector foundation tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_strategy_arena_mvp.py \
            tests/test_funding_carry_v1.py \
            tests/test_funding_extreme_long_validation.py \
            tests/test_forward_oos_selector_foundation.py
      - name: Initialize empty live-source-only Forward OOS snapshots
        run: |
          set -euo pipefail
          mkdir -p data/arena
          python -m strategy_arena.forward_oos_live_runner \
            --store-root data/arena/ci-empty-market-store \
            --league-root data/arena/ci-forward-oos-league \
            | tee data/arena/forward-oos-selector-foundation.log
          python -m strategy_arena.forward_oos_league_runner \
            --store-root data/arena/ci-empty-market-store \
            --league-root data/arena/ci-forward-oos-league \
            | tee -a data/arena/forward-oos-selector-foundation.log
      - name: Verify safety flags and live-source boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('data/arena/ci-forward-oos-league/league_metadata.json').read_text())
          assert metadata['orders_enabled'] is False
          assert metadata['paper_trading_enabled'] is False
          assert metadata['auto_promotion_enabled'] is False
          live = json.loads(Path('data/arena/ci-forward-oos-league/latest_live_foundation_snapshot.json').read_text())
          assert live['accepted_forward_source'] == 'binance_usdm_rest'
          assert live['orders_enabled'] is False
          assert live['paper_trading_enabled'] is False
          league = json.loads(Path('data/arena/ci-forward-oos-league/latest_league_run.json').read_text())
          assert league['status'] == 'NO_LIVE_FORWARD_DATA'
          assert league['orders_enabled'] is False
          assert league['paper_trading_enabled'] is False
          print(json.dumps(league, indent=2))
          PY
      - name: Upload foundation validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: strategy-arena-forward-oos-selector-foundation
          path: |
            data/arena/ci-forward-oos-league
            data/arena/forward-oos-selector-foundation.log
          retention-days: 90
