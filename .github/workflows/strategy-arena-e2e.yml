name: Strategy Arena E2E

on:
  pull_request:
    branches:
      - server-current-8000-2026-06-18
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Strategy Arena 28-day E2E backtest from Binance Vision archives
        run: python -m strategy_arena.archive_cli --symbol BTCUSDT --start 2026-06-21 --end 2026-07-18 --data-dir data/arena --output-dir data/arena/results --leverage 2
      - name: List result files
        if: always()
        run: find data/arena -maxdepth 6 -type f | sort || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-arena-e2e-results
          path: data/arena
          if-no-files-found: warn
