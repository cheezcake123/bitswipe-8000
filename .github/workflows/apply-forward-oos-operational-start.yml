name: Apply Forward OOS Operational Start Freeze

on:
  push:
    branches:
      - feature/forward-oos-operational-start-freeze-v2
    paths:
      - .github/workflows/apply-forward-oos-operational-start.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/forward-oos-operational-start-freeze-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Apply audited operational-start patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          planned = "2026-07-01T00:00:00+00:00"
          operational = "2026-07-21T15:00:00+00:00"
          reason = "collector_not_running_at_planned_boundary"

          selector_path = Path("strategy_arena/forward_oos_selector_foundation.py")
          text = selector_path.read_text(encoding="utf-8")

          old_constants = '''HISTORICAL_BACKTEST_CUTOFF_UTC = pd.Timestamp("2026-06-30T23:59:59.999Z")
          FORWARD_OOS_START_UTC = pd.Timestamp("2026-07-01T00:00:00Z")
          DEFAULT_LEAGUE_ROOT = "data/arena/forward_oos_league"
          REGISTRY_FILENAME = "frozen_strategy_registry.json"'''
          new_constants = '''HISTORICAL_BACKTEST_CUTOFF_UTC = pd.Timestamp("2026-06-30T23:59:59.999Z")
          PLANNED_FORWARD_OOS_START_UTC = pd.Timestamp("2026-07-01T00:00:00Z")
          OPERATIONAL_FORWARD_OOS_START_UTC = pd.Timestamp("2026-07-21T15:00:00Z")
          OPERATIONAL_FORWARD_OOS_START_REASON = "collector_not_running_at_planned_boundary"
          # Backward-compatible internal alias. All scoring/writes use the operational frozen boundary.
          FORWARD_OOS_START_UTC = OPERATIONAL_FORWARD_OOS_START_UTC
          DEFAULT_LEAGUE_ROOT = "data/arena/forward_oos_league"
          REGISTRY_FILENAME = "frozen_strategy_registry.json"'''
          if old_constants not in text:
              raise SystemExit("constant block not found")
          text = text.replace(old_constants, new_constants, 1)

          old_registry_validation = '''        payload = json.loads(Path(path).read_text(encoding="utf-8"))
                  if pd.Timestamp(payload["forward_oos_start_utc"]) != FORWARD_OOS_START_UTC:
                      raise ValueError("Forward OOS start is immutable and does not match code constant")
                  return cls(FrozenStrategyRecord(**item) for item in payload["strategies"])'''
          new_registry_validation = '''        payload = json.loads(Path(path).read_text(encoding="utf-8"))
                  if pd.Timestamp(payload["planned_forward_oos_start_utc"]) != PLANNED_FORWARD_OOS_START_UTC:
                      raise ValueError("Planned Forward OOS start does not match the audited original boundary")
                  if pd.Timestamp(payload["operational_forward_oos_start_utc"]) != OPERATIONAL_FORWARD_OOS_START_UTC:
                      raise ValueError("Operational Forward OOS start is frozen and does not match code constant")
                  if payload.get("operational_start_reason") != OPERATIONAL_FORWARD_OOS_START_REASON:
                      raise ValueError("Operational Forward OOS start reason does not match the audited reason")
                  return cls(FrozenStrategyRecord(**item) for item in payload["strategies"])'''
          if old_registry_validation not in text:
              raise SystemExit("registry validation block not found")
          text = text.replace(old_registry_validation, new_registry_validation, 1)

          metadata_pattern = re.compile(
              r"    def _ensure_metadata\(self\) -> None:\n.*?(?=    def append\(self, dataset: str, rows: list\[dict\]\) -> Path \| None:)",
              re.S,
          )
          metadata_replacement = '''    def _ensure_metadata(self) -> None:
                  self.root.mkdir(parents=True, exist_ok=True)
                  path = self.root / "league_metadata.json"
                  expected = {
                      "historical_backtest_cutoff_utc": HISTORICAL_BACKTEST_CUTOFF_UTC.isoformat(),
                      "planned_forward_oos_start_utc": PLANNED_FORWARD_OOS_START_UTC.isoformat(),
                      "operational_forward_oos_start_utc": OPERATIONAL_FORWARD_OOS_START_UTC.isoformat(),
                      "operational_start_reason": OPERATIONAL_FORWARD_OOS_START_REASON,
                      "operational_start_frozen": True,
                      "forward_oos_start_utc": OPERATIONAL_FORWARD_OOS_START_UTC.isoformat(),
                      "pre_operational_data_policy": "warmup_only_never_forward_scored",
                      "orders_enabled": False,
                      "paper_trading_enabled": False,
                      "auto_promotion_enabled": False,
                  }
                  if path.exists():
                      current = json.loads(path.read_text(encoding="utf-8"))
                      if "planned_forward_oos_start_utc" in current:
                          immutable_keys = (
                              "planned_forward_oos_start_utc",
                              "operational_forward_oos_start_utc",
                              "operational_start_reason",
                          )
                          if any(current.get(key) != expected[key] for key in immutable_keys):
                              raise RuntimeError("Forward OOS planned/operational boundaries cannot change after freeze")
                          if current.get("orders_enabled") is not False or current.get("paper_trading_enabled") is not False:
                              raise RuntimeError("Forward OOS safety flags must remain disabled")
                          return

                      legacy_start = current.get("forward_oos_start_utc")
                      if legacy_start != PLANNED_FORWARD_OOS_START_UTC.isoformat():
                          raise RuntimeError("Unexpected legacy Forward OOS metadata boundary")
                      existing_parts = [
                          part
                          for dataset in self.DATASETS
                          for part in (self.root / dataset).rglob("part-*.parquet")
                          if part.is_file()
                      ]
                      if existing_parts:
                          raise RuntimeError(
                              "Operational Forward OOS start cannot be rebased after League records exist"
                          )
                      migrated = {
                          **expected,
                          "legacy_planned_metadata_migrated": True,
                          "legacy_forward_oos_start_utc": legacy_start,
                          "metadata_migration_reason": OPERATIONAL_FORWARD_OOS_START_REASON,
                      }
                      path.write_text(json.dumps(migrated, indent=2), encoding="utf-8")
                  else:
                      path.write_text(json.dumps(expected, indent=2), encoding="utf-8")

          '''
          text, count = metadata_pattern.subn(metadata_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"metadata block replacement count={count}")

          old_append = '''        if (frame["timestamp"] < FORWARD_OOS_START_UTC).any():
                      raise ValueError("Historical/backtest rows cannot be written into Forward OOS League")
                  frame["recorded_at_utc"] = pd.Timestamp(datetime.now(timezone.utc)).floor("ms")
                  frame["forward_oos_start_utc"] = FORWARD_OOS_START_UTC'''
          new_append = '''        if (frame["timestamp"] < OPERATIONAL_FORWARD_OOS_START_UTC).any():
                      raise ValueError("Pre-operational rows cannot be written into Forward OOS League")
                  frame["recorded_at_utc"] = pd.Timestamp(datetime.now(timezone.utc)).floor("ms")
                  frame["planned_forward_oos_start_utc"] = PLANNED_FORWARD_OOS_START_UTC
                  frame["operational_forward_oos_start_utc"] = OPERATIONAL_FORWARD_OOS_START_UTC
                  frame["forward_oos_start_utc"] = OPERATIONAL_FORWARD_OOS_START_UTC'''
          if old_append not in text:
              raise SystemExit("append boundary block not found")
          text = text.replace(old_append, new_append, 1)
          selector_path.write_text(text, encoding="utf-8")

          registry_path = Path("strategy_arena/frozen_strategy_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          strategies_before = registry["strategies"]
          updated_registry = {
              "registry_version": 2,
              "historical_backtest_cutoff_utc": registry["historical_backtest_cutoff_utc"],
              "planned_forward_oos_start_utc": planned,
              "operational_forward_oos_start_utc": operational,
              "operational_start_reason": reason,
              "forward_oos_start_utc": operational,
              "strategies": strategies_before,
          }
          registry_path.write_text(json.dumps(updated_registry, indent=2) + "\n", encoding="utf-8")

          tests_path = Path("tests/test_forward_oos_selector_foundation.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "from strategy_arena.forward_oos_league_runner import _common_results",
              "from strategy_arena.forward_oos_league_runner import _common_results, build_forward_market_context",
              1,
          )
          tests = tests.replace(
              "    FORWARD_OOS_START_UTC,\n",
              "    FORWARD_OOS_START_UTC,\n    OPERATIONAL_FORWARD_OOS_START_REASON,\n    OPERATIONAL_FORWARD_OOS_START_UTC,\n    PLANNED_FORWARD_OOS_START_UTC,\n",
              1,
          )
          tests = tests.replace(
              '    ts = pd.date_range("2026-06-20T00:00:00Z", periods=24 * 14, freq="1h")',
              '    ts = pd.date_range("2026-07-10T00:00:00Z", periods=24 * 20, freq="1h")',
              1,
          )

          old_boundary_test = '''def test_forward_oos_start_is_fixed_and_historical_rows_are_rejected(tmp_path) -> None:
              store = AppendOnlyLeagueStore(tmp_path / "league")
              metadata = json.loads((tmp_path / "league" / "league_metadata.json").read_text())
              assert pd.Timestamp(metadata["forward_oos_start_utc"]) == FORWARD_OOS_START_UTC
              with pytest.raises(ValueError):
                  store.append("signals", [{"timestamp": "2026-06-30T23:00:00Z", "strategy_name": "x", "signal": "HOLD"}])


          '''
          new_boundary_test = '''def test_planned_and_operational_forward_oos_boundaries_are_frozen(tmp_path) -> None:
              store = AppendOnlyLeagueStore(tmp_path / "league")
              metadata = json.loads((tmp_path / "league" / "league_metadata.json").read_text())
              assert pd.Timestamp(metadata["planned_forward_oos_start_utc"]) == PLANNED_FORWARD_OOS_START_UTC
              assert pd.Timestamp(metadata["operational_forward_oos_start_utc"]) == OPERATIONAL_FORWARD_OOS_START_UTC
              assert metadata["operational_start_reason"] == OPERATIONAL_FORWARD_OOS_START_REASON
              assert pd.Timestamp(metadata["forward_oos_start_utc"]) == OPERATIONAL_FORWARD_OOS_START_UTC
              assert metadata["orders_enabled"] is False
              assert metadata["paper_trading_enabled"] is False
              assert metadata["auto_promotion_enabled"] is False
              with pytest.raises(ValueError):
                  store.append(
                      "signals",
                      [{"timestamp": "2026-07-21T14:59:59Z", "strategy_name": "x", "signal": "HOLD"}],
                  )
              assert store.append(
                  "signals",
                  [{"timestamp": "2026-07-21T15:00:00Z", "strategy_name": "x", "signal": "HOLD"}],
              ) is not None


def test_legacy_planned_metadata_migrates_only_before_any_league_records(tmp_path) -> None:
              root = tmp_path / "league"
              root.mkdir(parents=True)
              (root / "league_metadata.json").write_text(
                  json.dumps(
                      {
                          "historical_backtest_cutoff_utc": "2026-06-30T23:59:59.999+00:00",
                          "forward_oos_start_utc": PLANNED_FORWARD_OOS_START_UTC.isoformat(),
                          "immutable_start": True,
                          "orders_enabled": False,
                          "paper_trading_enabled": False,
                          "auto_promotion_enabled": False,
                      }
                  )
              )
              AppendOnlyLeagueStore(root)
              metadata = json.loads((root / "league_metadata.json").read_text())
              assert metadata["legacy_planned_metadata_migrated"] is True
              assert metadata["legacy_forward_oos_start_utc"] == PLANNED_FORWARD_OOS_START_UTC.isoformat()
              assert pd.Timestamp(metadata["operational_forward_oos_start_utc"]) == OPERATIONAL_FORWARD_OOS_START_UTC


          '''
          if old_boundary_test not in tests:
              raise SystemExit("boundary test block not found")
          tests = tests.replace(old_boundary_test, new_boundary_test, 1)

          tests = tests.replace('    ts = pd.Timestamp("2026-07-02T00:00:00Z")\n    archive_row', '    ts = pd.Timestamp("2026-07-10T00:00:00Z")\n    archive_row', 1)

          insertion_anchor = '''    assert result["accepted_forward_source"] == "binance_usdm_rest"
              assert result["forward_live_rows_available"] == 0


          '''
          new_gap_test = '''    assert result["accepted_forward_source"] == "binance_usdm_rest"
              assert result["forward_live_rows_available"] == 0


def test_pre_operational_live_timestamp_rows_are_warmup_only_not_forward_scored(tmp_path) -> None:
              market = AppendOnlyMarketStore(tmp_path / "market")
              pre = pd.date_range("2026-07-21T14:00:00Z", periods=60, freq="1min")
              operational = pd.date_range("2026-07-21T15:00:00Z", periods=60, freq="1min")
              ts = pre.append(operational)
              close = 100.0 + np.arange(len(ts), dtype=float) * 0.001
              frame = pd.DataFrame(
                  {
                      "timestamp": ts,
                      "close_time": ts + pd.Timedelta(minutes=1) - pd.Timedelta(milliseconds=1),
                      "symbol": "BTCUSDT",
                      "source": "binance_usdm_rest",
                      "open": close,
                      "high": close + 0.01,
                      "low": close - 0.01,
                      "close": close,
                      "volume": 1.0,
                  }
              )
              market.append("futures_ohlcv", frame)
              context = build_forward_market_context(market)
              forward = context["hourly"][context["hourly"]["timestamp"] >= OPERATIONAL_FORWARD_OOS_START_UTC]
              assert list(forward["timestamp"]) == [OPERATIONAL_FORWARD_OOS_START_UTC]
              assert context["data_quality"]["forward_complete_hour_rows"] == 1
              assert context["data_quality"]["expected_complete_hours_through_latest_complete"] == 1
              assert context["data_quality"]["missing_complete_hours"] == 0


          '''
          if insertion_anchor not in tests:
              raise SystemExit("archive test anchor not found")
          tests = tests.replace(insertion_anchor, new_gap_test, 1)
          tests_path.write_text(tests, encoding="utf-8")

          docs_path = Path("strategy_arena/FORWARD_OOS_SELECTOR_FOUNDATION.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace(
              '''## Immutable Forward OOS boundary

          - Historical/backtest cutoff: `2026-06-30T23:59:59.999Z`
          - Forward OOS start: `2026-07-01T00:00:00Z`
          - Pre-start data may be used only as backward-looking warm-up context.
          - Forward League records reject pre-start timestamps.
          - Forward scoring accepts post-boundary live Collector sources only: `binance_usdm_rest` for Futures/Funding/OI and `binance_spot_rest` for Spot.
          - Binance Vision archive rows remain history/warm-up only even if appended later.
          ''',
              '''## Frozen Forward OOS boundaries

          - Historical/backtest cutoff: `2026-06-30T23:59:59.999Z`
          - Planned Forward OOS start: `2026-07-01T00:00:00Z`
          - Operational Forward OOS start: `2026-07-21T15:00:00Z`
          - Audit reason: `collector_not_running_at_planned_boundary`.
          - The planned boundary is preserved for provenance; it is not used for scoring.
          - The operational boundary is frozen because the production Collector first supplied a complete live-collected hour there, before any Forward OOS strategy/selector performance was recorded.
          - Any data timestamped between the planned and operational boundaries is warm-up/history only, including later REST backfill; it can never become Forward League performance retroactively.
          - Forward League records reject timestamps before the operational boundary.
          - Forward scoring accepts post-operational-boundary live Collector sources only: `binance_usdm_rest` for Futures/Funding/OI and `binance_spot_rest` for Spot.
          - Binance Vision archive rows remain history/warm-up only even if appended later.
          ''',
              1,
          )
          docs_path.write_text(docs, encoding="utf-8")

          workflow_path = Path(".github/workflows/strategy-arena-forward-oos-selector.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_assertion = '''          metadata = json.loads(Path('data/arena/ci-forward-oos-league/league_metadata.json').read_text())
                    assert metadata['orders_enabled'] is False'''
          new_assertion = '''          metadata = json.loads(Path('data/arena/ci-forward-oos-league/league_metadata.json').read_text())
                    assert metadata['planned_forward_oos_start_utc'] == '2026-07-01T00:00:00+00:00'
                    assert metadata['operational_forward_oos_start_utc'] == '2026-07-21T15:00:00+00:00'
                    assert metadata['operational_start_reason'] == 'collector_not_running_at_planned_boundary'
                    assert metadata['orders_enabled'] is False'''
          if old_assertion not in workflow:
              raise SystemExit("CI metadata assertion block not found")
          workflow = workflow.replace(old_assertion, new_assertion, 1)
          workflow_path.write_text(workflow, encoding="utf-8")

          # The temporary patch workflow must not remain in the final PR diff.
          Path(".github/workflows/apply-forward-oos-operational-start.yml").unlink()
          PY

      - name: Verify patch scope and safety text
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          ! git diff --name-only | grep -E '^strategy_arena/(strategies|funding_carry_v1|funding_aligned_momentum_v1|trend_breakout_v1|volatility_compression_v1)\.py$'
          grep -q 'OPERATIONAL_FORWARD_OOS_START_UTC = pd.Timestamp("2026-07-21T15:00:00Z")' strategy_arena/forward_oos_selector_foundation.py
          grep -q 'collector_not_running_at_planned_boundary' strategy_arena/forward_oos_selector_foundation.py

      - name: Commit deterministic patch to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Freeze operational Forward OOS start after collector gap"
          git push origin HEAD:feature/forward-oos-operational-start-freeze-v2
