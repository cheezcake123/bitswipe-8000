name: Strategy Arena Funding Extreme Long Validation

on:
  pull_request:
    branches:
      - server-current-8000-2026-06-18
    paths:
      - 'strategy_arena/funding_extreme_long_validation.py'
      - 'strategy_arena/funding_extreme_long_validation_cli.py'
      - 'tests/test_funding_extreme_long_validation.py'
      - '.github/workflows/strategy-arena-funding-extreme-long-validation.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run Strategy Arena regression and Funding Extreme validation tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/arena
          pytest -q \
            tests/test_strategy_arena_mvp.py \
            tests/test_market_data_foundation.py \
            tests/test_funding_carry_v1.py \
            tests/test_funding_extreme_long_validation.py \
            2>&1 | tee data/arena/funding_extreme_long_tests.log
      - name: Run frozen Funding Extreme Reversal v1 long validation
        shell: bash
        run: |
          set -euo pipefail
          python -m strategy_arena.funding_extreme_long_validation_cli \
            --symbol BTCUSDT \
            --start-month 2019-09 \
            --end-month 2026-06 \
            --evaluation-start 2020-01-01T00:00:00Z \
            --output-dir data/arena/funding_extreme_long_validation \
            --workers 6 2>&1 | tee data/arena/funding_extreme_long_validation.log
      - name: Show summary
        if: always()
        run: |
          cat data/arena/funding_extreme_long_tests.log || true
          cat data/arena/funding_extreme_long_validation/summary.json || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-arena-funding-extreme-long-validation
          path: |
            data/arena/funding_extreme_long_validation
            data/arena/funding_extreme_long_validation.log
            data/arena/funding_extreme_long_tests.log
          retention-days: 90
          if-no-files-found: warn
